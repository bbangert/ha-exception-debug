name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# Least privilege. These jobs only read the repo; two of the actions below are
# third-party, so nothing should inherit the repo default token scope.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA rather than a moving branch.
# Neither home-assistant/actions nor hacs/action publishes usable release tags
# (their newest are from 2020 and 2022), and upstream documents the branch refs
# — so a SHA pin is the only way to make a run reproducible. Dependabot
# (.github/dependabot.yml) keeps these current.
jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt
      - name: Check formatting
        run: ruff format --check custom_components tests
      - name: Lint
        run: ruff check custom_components tests

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt
      - name: Type check
        # Not --strict: Home Assistant does not re-export several symbols we
        # legitimately import, which produces attr-defined noise unrelated to
        # this code.
        run: mypy custom_components/exception_debug --ignore-missing-imports

  test:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor declared in hacs.json. Without this job that claim is
          # never actually exercised.
          #
          # pycares<5 is required here: the aiodns pinned by this Home
          # Assistant release calls pycares APIs that pycares 5 removed, so an
          # unconstrained resolve fails at import time. Unrelated to this
          # integration's own code.
          - phacc: "0.13.270"
            ha: "2025.8.1 (floor)"
            extra: '"pycares<5"'
          - phacc: "0.13.316"
            ha: "2026.2.3"
            extra: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest-homeassistant-custom-component==${{ matrix.phacc }}" \
            "pytest-cov==7.0.0" ${{ matrix.extra }}
      - name: Run pytest
        run: >-
          pytest
          --cov=custom_components.exception_debug
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
